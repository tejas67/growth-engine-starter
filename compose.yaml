services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growth_starter
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:${GROWTH_DB_PORT:-5447}:5432"
    volumes:
      - growth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growth_starter"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  growth_data:
